<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f6f7f9;font-family:Arial,sans-serif;color:#18181b">
    <div style="max-width:560px;margin:0 auto;padding:40px 20px">
      <div style="background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:32px">
        <h1 style="font-size:24px;margin:0 0 16px">Reset your password</h1>
        <p style="font-size:15px;line-height:1.6;margin:0 0 24px">
          We received a request to reset your CheckUp360 password.
        </p>
        <a href="{action_url}" style="display:inline-block;background:#18181b;color:#fff;text-decoration:none;border-radius:8px;padding:12px 18px;font-weight:600">
          Reset password
        </a>
        <p style="font-size:13px;line-height:1.6;color:#71717a;margin:24px 0 0">
          If you did not request this change, you can safely ignore this email.
        </p>
      </div>
    </div>
  </body>
</html>
