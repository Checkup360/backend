name: Lint, Check & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    name: Lint, Format, Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install / Sync environment with uv
        run: |
          uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .

      - name: Format (ruff format)
        run: |
          uv run ruff format . --check

      - name: Run unit tests
        run: |
          uv run pytest -q
