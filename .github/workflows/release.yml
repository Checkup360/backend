name: Release image

# Build and push the backend image to GHCR on every published release.

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/backend
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-version:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Check skip-pr
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          BODY="${RELEASE_BODY:-$(gh release view "${{ github.ref_name }}" --repo "$GH_REPO" --json body -q .body 2>/dev/null || true)}"
          if echo "$BODY" | grep -qiE 'skip-pr|no-pr'; then
            echo "Release body contains skip-pr/no-pr. Skipping PR creation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No skip flag found in release body."
          fi

      - name: Checkout infra repo
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/infra
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}

      - name: Update backend version in staging.yml
        if: steps.check.outputs.skip != 'true'
        uses: mikefarah/yq@v4.53.2
        with:
          cmd: yq -i '.backend = "${{ github.ref_name }}"' versions/staging.yml

      - name: Create or update PR
        if: steps.check.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          commit-message: "chore(staging): update backend to ${{ github.ref_name }}"
          branch: "update/backend-${{ github.ref_name }}"
          delete-branch: true
          title: "Staging Deploy: Backend ${{ github.ref_name }}"
          body: |
            Automated version update from backend release

            **Backend**: `${{ github.ref_name }}`
            **Frontends**: [latest in versions/staging.yml]

            This PR updates the backend version for staging. Once approved and merged, the deployment will start automatically.
          labels: deployment,automated
