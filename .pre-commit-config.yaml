repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check via uv
        entry: uv run ruff check . --fix --extend-exclude alembic/versions
        language: system
        files: ^(?!alembic/versions/).*\.py$

      - id: black-check
        name: black check via uv
        entry: uv run black --check . --exclude 'alembic/versions'
        language: system
        files: ^(?!alembic/versions/).*\.py$

      - id: ruff-format
        name: ruff format via uv
        entry: uv run ruff format .
        language: system
        files: ^(?!alembic/versions/).*\.py$

      - id: pyright
        name: pyright via uv
        entry: uv run pyright
        language: system
        files: ^(?!alembic/versions/).*\.py$
